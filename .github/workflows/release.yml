name: Release App

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: lyrics
            artifact: lyrics-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: lyrics
            artifact: lyrics-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lyrics.exe
            artifact: lyrics-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set rustup toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-all-crates: true

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lyrics-linux-x86_64
          path: release/linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lyrics-linux-aarch64
          path: release/linux-aarch64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lyrics-windows-x86_64
          path: release/windows

      - name: Rename assets
        run: |
          mv release/linux-x86_64/lyrics release/lyrics-linux-x86_64
          mv release/linux-aarch64/lyrics release/lyrics-linux-aarch64
          mv release/windows/lyrics.exe release/lyrics-windows-x86_64.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/lyrics-linux-x86_64
            release/lyrics-linux-aarch64
            release/lyrics-windows-x86_64.exe
