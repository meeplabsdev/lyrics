[package]
name = "lyrics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = "1.25.2"
chrono = { version = "0.4.45", features = ["serde"] }
color-thief = "0.2.2"
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = ["all_loaders"] }
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
image = { version = "0.25.10" }
librespot-protocol = "0.8.0"
paris = { version = "1.5.15", features = ["macros", "timestamps"] }
protobuf = "3.7.2"
qrcode = "0.15.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["brotli", "deflate", "form", "gzip", "json", "multipart", "query", "stream", "zstd"] }
rgb = "0.8.53"
rmp-serde = "1.3.1"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["macros","rt-multi-thread","time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = { version = "2.5.9", features = ["serde"] }
